steps:
  # 1. Build Backend Docker Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/kpi-backend:$COMMIT_SHA
      - ./server

  # 2. Push Container to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/kpi-backend:$COMMIT_SHA

  # 3. Deploy Backend to Cloud Run (Dynamic Switch based on $PROJECT_ID)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        if [ "$PROJECT_ID" = "ggpc-kpi-system" ]; then
          echo "=========================================="
          echo "===> EXECUTING PRODUCTION DEPLOYMENT <==="
          echo "=========================================="
          SERVICE_NAME="kpi-backend-prod"
          DB_NAME="kpi_db_production"
          CLIENT_ID="YOUR_PRODUCTION_GOOGLE_CLIENT_ID"
          CORS="https://ggpc-kpi-system.web.app,https://ggpc-kpi-system.firebaseapp.com"
          USER_SECRET="PROD_DB_USER"
        else
          echo "=========================================="
          echo "===> EXECUTING STAGING DEPLOYMENT <======"
          echo "=========================================="
          SERVICE_NAME="kpi-backend-test"
          DB_NAME="kpi_db_test"
          CLIENT_ID="325496284731-eok0psn10r65eos2l3qdjq6dugse1kcr.apps.googleusercontent.com"
          CORS="https://ggpc-kpi-test.web.app,https://ggpc-kpi-test.firebaseapp.com"
          USER_SECRET="TEST_DB_USER"
        fi

        # Safely quoted variables to prevent bash pipe execution errors
        gcloud run deploy $$SERVICE_NAME \
          --image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/kpi-backend:$COMMIT_SHA \
          --region=asia-southeast1 \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --add-cloudsql-instances=ggpc-kpi-test:asia-southeast1:kpi-instance \
          --set-env-vars="^|^INSTANCE_CONNECTION_NAME=ggpc-kpi-test:asia-southeast1:kpi-instance|DB_NAME=$$DB_NAME|NODE_ENV=production|GOOGLE_CLIENT_ID=$$CLIENT_ID|CORS_ORIGINS=$$CORS" \
          --set-secrets="DB_USER=$$USER_SECRET:latest,DB_PASSWORD=DB_PASSWORD:latest,JWT_SECRET=JWT_SECRET:latest"

  # 4. Inject Dynamic Backend URL into Client Production Environment
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        if [ "$PROJECT_ID" = "ggpc-kpi-system" ]; then
          SERVICE_NAME="kpi-backend-prod"
          CLIENT_ID="YOUR_PRODUCTION_GOOGLE_CLIENT_ID"
        else
          SERVICE_NAME="kpi-backend-test"
          CLIENT_ID="325496284731-eok0psn10r65eos2l3qdjq6dugse1kcr.apps.googleusercontent.com"
        fi

        BACKEND_URL=$(gcloud run services describe $$SERVICE_NAME --region=asia-southeast1 --format='value(status.url)')
        printf "VITE_API_URL=%s\nVITE_GOOGLE_CLIENT_ID=%s\n" "$$BACKEND_URL" "$$CLIENT_ID" > client/.env.production

  # 5. Build React Production Bundle
  - name: 'node:20'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd client
        npm ci
        npm run build

  # 6. Deploy Client to Firebase Hosting Target ($PROJECT_ID)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        gcloud secrets versions access latest --secret=FIREBASE_SERVICE_ACCOUNT --project=$PROJECT_ID > /tmp/firebase-service-account.json
        export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json
        curl -sL https://firebase.tools | bash
        firebase use --add $PROJECT_ID
        firebase deploy --project=$PROJECT_ID --only=hosting --non-interactive

images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/kpi-backend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
