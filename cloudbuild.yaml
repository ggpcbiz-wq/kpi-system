steps:
  # 1. Build Backend Docker Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/kpi-backend:$COMMIT_SHA
      - ./server

  # 2. Push Container to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/kpi-backend:$COMMIT_SHA

  # 3. Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - kpi-backend-test
      - --image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/kpi-backend:$COMMIT_SHA
      - --region=asia-southeast1
      - --platform=managed
      - --service-account=kpi-cloud-run-service-account@ggpc-kpi-test.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --port=8080
      - --add-cloudsql-instances=ggpc-kpi-test:asia-southeast1:kpi-instance
      - --set-env-vars=^|^INSTANCE_CONNECTION_NAME=ggpc-kpi-test:asia-southeast1:kpi-instance|DB_NAME=kpi_db_test|NODE_ENV=production|GOOGLE_CLIENT_ID=325496284731-eok0psn10r65eos2l3qdjq6dugse1kcr.apps.googleusercontent.com|KINTONE_DOMAIN=vez7o26y38rb.cybozu.com|KINTONE_KPI_APP_ID=1910|KINTONE_MASTER_APP_ID=111|KINTONE_ORGANIZATION_APP_ID=204|GOOGLE_DRIVE_FOLDER_ID=1pZWpmM6U32evDmGuzYHn8t5u0BgvzXjS|CORS_ORIGINS=https://ggpc-kpi-test.web.app,https://ggpc-kpi-test.firebaseapp.com
      - --set-secrets=DB_USER=TEST_DB_USER:latest,DB_PASSWORD=DB_PASSWORD:latest,JWT_SECRET=JWT_SECRET:latest,KINTONE_KPI_API_KEY=KINTONE_KPI_API_KEY:latest,KINTONE_MASTER_API_KEY=KINTONE_MASTER_API_KEY:latest,KINTONE_ORGANIZATION_API_KEY=KINTONE_ORGANIZATION_API_KEY:latest

  # 4. Inject Dynamic Backend URL & Correct Google Client ID into Client Production Environment
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - gcloud run services describe kpi-backend-test --region=asia-southeast1 --format='value(status.url)' | xargs -I {} sh -c 'printf "VITE_API_URL=%s\nVITE_GOOGLE_CLIENT_ID=325496284731-eok0psn10r65eos2l3qdjq6dugse1kcr.apps.googleusercontent.com\n" "{}" > client/.env.production'

  # 5. Build Vite React Frontend Client
  - name: 'node:20'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd client
        npm ci
        npm run build

  # 6. Deploy Client to Staging Firebase Hosting
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        gcloud secrets versions access latest --secret=FIREBASE_SERVICE_ACCOUNT --project=$PROJECT_ID > /tmp/firebase-service-account.json
        export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json
        curl -sL https://firebase.tools | bash
        firebase use --add ggpc-kpi-test
        firebase deploy --project=ggpc-kpi-test --only=hosting --non-interactive

images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/kpi-backend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY